<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Trophy Guide &amp; Tracker — Leonida Legend</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <h1 class="sunset-title">GTA VI Trophy Guide</h1>
  <p class="subtitle">Grand Theft Auto VI · PlayStation 5 · 55 Trophies · Leonida Legend</p>
</header>

<main class="layout">
  <section class="list-pane" id="listPane">
    <div class="controls">
      <input type="search" id="searchBox" placeholder="Search trophies…" aria-label="Search trophies">
      <div class="filter-row" role="group" aria-label="Filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="story">Story</button>
        <button class="filter-btn" data-filter="missable">Missable</button>
        <button class="filter-btn" data-filter="collectible">Collectibles</button>
        <button class="filter-btn" data-filter="activity">Activities</button>
      </div>
      <div class="toggle-row">
        <label class="spoiler-label">
          <input type="checkbox" id="spoilerToggle"> Hide story spoilers
        </label>
        <button id="exportBtn" class="mini-btn">Export</button>
        <button id="importBtn" class="mini-btn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0 / 55</span>
    </div>

    <ul class="trophy-list" id="trophyList"></ul>
  </section>

  <aside class="guide-pane" id="guidePane" aria-live="polite">
    <div class="guide-empty" id="guideEmpty">Select a trophy to view its guide.</div>
  </aside>
</main>

<footer class="site-footer">
  <p>Offline guide · progress saved locally in your browser · <span id="saveHint">All changes saved</span></p>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
